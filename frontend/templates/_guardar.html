<div class="modal-bg" onclick="document.getElementById('popover').innerHTML=''">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="cerrar" onclick="document.getElementById('popover').innerHTML=''">×</button>
    <h4>Guardar en colección</h4>

    <form class="col-nueva" hx-post="/coleccion/guardar" hx-target="#popover" hx-swap="innerHTML">
      <input type="hidden" name="imagen_id" value="{{ imagen_id }}">
      <input name="nuevo" placeholder="Crear colección nueva…" autocomplete="off">
      <button type="submit">Crear</button>
    </form>

    <div class="col-list">
      {% for c in colecciones %}
        {% if c.guardada %}
          <button type="button" class="col-item guardada"
                  hx-post="/coleccion/quitar-img" hx-target="#popover" hx-swap="innerHTML"
                  hx-vals='{"imagen_id": {{ imagen_id }}, "coleccion_id": {{ c.id }}}'>
            <span class="cn">{{ c.nombre }}</span>
            <span class="marca">✓ Guardada</span>
          </button>
        {% else %}
          <button type="button" class="col-item"
                  hx-post="/coleccion/guardar" hx-target="#popover" hx-swap="innerHTML"
                  hx-vals='{"imagen_id": {{ imagen_id }}, "coleccion_id": {{ c.id }}}'>
            <span class="cn">{{ c.nombre }} <span class="n">({{ c.n }})</span></span>
            <span class="accion-g">Guardar</span>
          </button>
        {% endif %}
      {% else %}
        <div style="color:var(--muted);font-size:.8rem;padding:.3rem 0">Aún no tienes colecciones. Crea una arriba.</div>
      {% endfor %}
    </div>
  </div>
</div>
