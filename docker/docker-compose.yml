services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pose_db
    environment:
      POSTGRES_USER: pose
      POSTGRES_PASSWORD: pose
      POSTGRES_DB: pose_estimation
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pose -d pose_estimation"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
